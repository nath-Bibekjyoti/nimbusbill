[package]
name = "nimbusbill-desktop"
version = "0.1.0"
description = "NimbusBill desktop app"
authors = ["NimbusBill"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "nimbusbill_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "nimbusbill-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
nimbusbill = { path = ".." }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
